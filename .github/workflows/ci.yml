name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm install --no-audit --no-fund
        working-directory: app
      - run: npm run build:prod
        working-directory: app

  api:
    name: API — Maven test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B test
        working-directory: api

  # Full compose smoke needs local api-dotnet/ (gitignored). Restore at cutover.
  stack:
    name: Stack — smoke (deferred until cutover)
    runs-on: ubuntu-latest
    steps:
      - run: echo "Skipped: Traefik still uses gitignored api-dotnet until phase 07."
